<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle pulse circles -->
  <circle cx="256" cy="270" r="190" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="12 12" opacity="0.35" />
  <circle cx="256" cy="270" r="145" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.25" />

  <!-- Hand with rehabilitation aura (Stylized Hand with raised gesture) -->
  <g filter="url(#shadow)">
    <!-- Palm & wrist base -->
    <path d="M 210 390 C 210 340, 215 320, 215 280 
             C 215 250, 195 240, 175 220 
             C 160 205, 175 190, 190 200 
             C 210 215, 225 245, 230 250
             L 230 160 C 230 142, 255 142, 255 160
             L 255 245
             L 260 140 C 260 122, 285 122, 285 140
             L 285 245
             L 290 155 C 290 137, 315 137, 315 155
             L 315 255
             L 320 185 C 320 168, 342 168, 342 185
             C 342 240, 345 285, 335 330
             C 325 375, 305 400, 290 410
             L 220 410 Z" 
          fill="url(#handGrad)" />

    <!-- Joint tracking dots (MediaPipe AI representation) -->
    <!-- Wrist -->
    <circle cx="255" cy="385" r="7" fill="#0d9488" />
    <!-- MCPs -->
    <circle cx="225" cy="280" r="6" fill="#0d9488" />
    <circle cx="243" cy="245" r="6" fill="#0d9488" />
    <circle cx="273" cy="240" r="6" fill="#0d9488" />
    <circle cx="303" cy="250" r="6" fill="#0d9488" />
    <circle cx="330" cy="275" r="6" fill="#0d9488" />
    <!-- Tips -->
    <circle cx="180" cy="205" r="7" fill="#f59e0b" filter="url(#glow)" />
    <circle cx="242" cy="155" r="7" fill="#f59e0b" filter="url(#glow)" />
    <circle cx="273" cy="135" r="7" fill="#f59e0b" filter="url(#glow)" />
    <circle cx="302" cy="150" r="7" fill="#f59e0b" filter="url(#glow)" />
    <circle cx="331" cy="180" r="7" fill="#f59e0b" filter="url(#glow)" />

    <!-- AI connecting lines -->
    <path d="M 255 385 L 243 245 M 243 245 L 242 155 M 255 385 L 273 240 M 273 240 L 273 135" 
          stroke="#0d9488" stroke-width="2.5" opacity="0.4" />
  </g>

  <!-- Sparkle / Success Star top right -->
  <g transform="translate(360, 95)" filter="url(#glow)">
    <path d="M 20 0 L 26 14 L 40 20 L 26 26 L 20 40 L 14 26 L 0 20 L 14 14 Z" fill="url(#accentGrad)" />
  </g>
  <g transform="translate(100, 130)" filter="url(#glow)">
    <path d="M 14 0 L 18 10 L 28 14 L 18 18 L 14 28 L 10 18 L 0 14 L 10 10 Z" fill="#5eead4" opacity="0.9" />
  </g>

  <!-- Medical Cross Badge bottom-left -->
  <g transform="translate(64, 380)">
    <rect width="64" height="64" rx="18" fill="#ffffff" filter="url(#shadow)" />
    <rect x="26" y="16" width="12" height="32" rx="4" fill="#0d9488" />
    <rect x="16" y="26" width="32" height="12" rx="4" fill="#0d9488" />
  </g>
</svg>